  - id: INFRA-020
    title: Sidecar concurrency model (thread per request, panic guard, drain on shutdown)
    area: infra
    priority: P1
    priority_inferred: true
    status: done
    acceptance:
      - Reader loop never blocks on handler work; each request runs on its own OS thread (no tokio)
      - Response compute is pure; only the frame write is serialized by a stdout mutex
      - All in-flight responses are flushed before exit even if stdin closes immediately
      - A handler panic is caught (catch_unwind) and still answers its correlation_id
    evidence:
      - crates/bitvue-sidecar/src/request_dispatch.rs::spawn_request
      - crates/bitvue-sidecar/src/request_dispatch.rs::compute_frames_with_panic_guard
      - crates/bitvue-sidecar/src/request_dispatch.rs::panicking_handler_still_cleans_up_the_registry_and_returns_a_real_error_response
      - crates/bitvue-sidecar/tests/subprocess_smoke.rs::all_in_flight_responses_arrive_even_when_stdin_closes_immediately_after
    source:
      - DEVELOPMENT_PHASES.md §bitvue-sidecar 동시성 모델
    notes: catch_unwind panic guard is newer than the 2026-08-08 log (CONC-022). No latency measurement exists by design (doc).
