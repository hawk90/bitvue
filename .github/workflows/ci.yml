name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a PR branch cancels the stale run; pushes to main always run
# to completion so every merged commit keeps a full CI result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# dorny/paths-filter reads the pull request's file list through the API, so
# it needs pull-requests: read on top of what the checkout needs.
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ================================
  # 1. Detect Changes
  # ================================

  changes:
    name: Detect Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            # A workflow edit counts as both: it is the one change that can
            # break a job without touching the code the job tests.
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - '.github/workflows/ci.yml'

  # ================================
  # 2. Quick Smoke Tests (run on push + PR)
  # ================================

  rust-smoke:
    name: Rust Smoke Test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          build-warnings: allow
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify Cargo.lock is current
        run: cargo fetch --locked
      - name: Install dav1d
        run: sudo apt-get install -y libdav1d-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --workspace

  frontend-smoke:
    name: Frontend Smoke Test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Check formatting
        run: cd frontend && npm run format:check
      - name: Build frontend
        run: cd frontend && npm run build

  # ================================
  # 3. Rust Full Checks (PR only)
  # ================================

  fmt:
    name: Format (Rust)
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      needs.changes.outputs.rust == 'true' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt
          cache: false
          build-warnings: allow
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (Rust)
    needs: [changes, fmt]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.rust == 'true' &&
      (needs.fmt.result == 'success' || needs.fmt.result == 'skipped') &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
          cache: false
          build-warnings: allow
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev
      - run: cargo clippy --workspace --lib --exclude abseil -- -D warnings
      # Benches are never run in CI; compile them so they cannot silently rot again.
      - run: cargo check --workspace --exclude abseil --benches

  test:
    name: Test (${{ matrix.crate }}, ${{ matrix.os }})
    needs: [changes, fmt, clippy]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.rust == 'true' &&
      (needs.fmt.result == 'success' || needs.fmt.result == 'skipped') &&
      (needs.clippy.result == 'success' || needs.clippy.result == 'skipped')
    strategy:
      fail-fast: false
      # 19 crates x 3 OSes = 57 jobs. The account has 20 concurrent runners, so
      # letting all 57 queue at once starves every other run (PR and main) for
      # up to 18 minutes; capping the matrix leaves slots for the rest.
      max-parallel: 12
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
        # Every workspace member with tests. Not listed, with the reason:
        #   bitvue, bitvue-codecs       re-export facades, no tests
        #   bitvue-benchmarks           criterion benches only
        #   bitvue-test-data            fixtures only
        #   abseil (crates/vendor)      private fork, excluded everywhere (CLAUDE.md)
        crate:
          - bitvue-engine
          - bitvue-protocol
          - bitvue-sidecar
          - bitvue-indexer
          - bitvue-formats
          - bitvue-avc
          - bitvue-hevc
          - bitvue-vp9
          - bitvue-vvc
          - bitvue-av1-codec
          - bitvue-mpeg2-codec
          - bitvue-avs3
          - bitvue-jpegxs
          - bitvue-vc3
          - bitvue-codecs-parser
          - bitvue-decode
          - bitvue-metrics
          - bitvue-cli
          - bitvue-mcp
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          build-warnings: allow
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install dav1d (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install dav1d

      - name: Free up disk space (Linux)
        if: matrix.os == 'ubuntu-26.04'
        run: |
          echo "Disk space before cleanup:"
          df -h
          # Remove unnecessary packages and files to free up ~30GB+
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/graalvm/
          sudo rm -rf /usr/local/.ghcup/
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo apt-get clean
          docker rmi $(docker image ls -aq) || true
          echo "Disk space after cleanup:"
          df -h

      - name: Install dav1d (Linux)
        if: matrix.os == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdav1d-dev pkg-config

      - name: Install dav1d (Windows) - vcpkg
        if: matrix.os == 'windows-latest'
        run: |
          if (-not (Test-Path "D:\vcpkg\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg D:\vcpkg
            D:\vcpkg\bootstrap-vcpkg.bat
          }
          D:\vcpkg\vcpkg install dav1d:x64-windows-static pkgconf:x64-windows-static --clean-after-build
          echo "PKG_CONFIG_PATH=D:\vcpkg\installed\x64-windows-static\lib\pkgconfig" >> $env:GITHUB_ENV
          echo "D:\vcpkg\installed\x64-windows-static\tools\pkgconf" >> $env:GITHUB_PATH

      - name: Run tests
        run: cargo test -p ${{ matrix.crate }} --no-fail-fast
        env:
          # Disable incremental compilation to save disk space
          CARGO_INCREMENTAL: 0

  # ================================
  # 3b. Parity Regression Suite (PR + main)
  # ================================
  # Keeps docs/PARITY_CHECKLIST.md honest — that doc's "Last run" section was
  # manually pasted and went stale for 3+ months before this job existed.
  # Runs scripts/parity_check.sh --local (fixtures only, no network) against
  # a debug build of the CLI. See docs/PARITY_CHECKLIST.md for what it checks.

  parity-regression:
    name: Parity Regression Suite
    needs: [changes, fmt, clippy]
    if: |
      always() &&
      needs.changes.outputs.rust == 'true' &&
      (needs.fmt.result == 'success' || needs.fmt.result == 'skipped') &&
      (needs.clippy.result == 'success' || needs.clippy.result == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          build-warnings: allow
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install dav1d
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev pkg-config
      - name: Build CLI (debug)
        run: cargo build -p bitvue-cli --bin bitvue
      - name: Run parity regression suite
        run: ./scripts/parity_check.sh --local

  # ================================
  # 4. Code Coverage (PR + main)
  # ================================

  coverage:
    name: Code Coverage
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      needs.changes.outputs.rust == 'true' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: llvm-tools-preview
          cache: false
          build-warnings: allow

      # rust-cache resolves `<workspace> -> <target>` with the target *relative to the workspace*
      # (an absolute path is joined under it), so point it at CARGO_TARGET_DIR=/tmp/t (set below)
      # via a relative path from /home/runner/work/bitvue/bitvue.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> ../../../../../tmp/t"
          shared-key: "coverage"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-llvm-cov

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev pkg-config

      # Use a short CARGO_TARGET_DIR (/tmp/t; the runner cannot create /t) and a per-crate approach to stay under
      # the Linux ARG_MAX limit (131072 bytes).  Each crate is measured
      # independently; reports are merged into a single Codecov upload.
      - name: Generate coverage (codec crates)
        env:
          CARGO_TARGET_DIR: /tmp/t
        run: |
          mkdir -p coverage
          for CRATE in bitvue-hevc bitvue-avc bitvue-vp9 bitvue-av1-codec bitvue-avs3 bitvue-jpegxs bitvue-vc3 bitvue-codecs-parser bitvue-engine bitvue-formats bitvue-cli; do
            echo "=== $CRATE ==="
            cargo llvm-cov \
              --package "$CRATE" \
              --codecov \
              --output-path "coverage/${CRATE}.json"
          done

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage/bitvue-hevc.json,coverage/bitvue-avc.json,coverage/bitvue-vp9.json,coverage/bitvue-av1-codec.json,coverage/bitvue-avs3.json,coverage/bitvue-jpegxs.json,coverage/bitvue-vc3.json,coverage/bitvue-codecs-parser.json,coverage/bitvue-engine.json,coverage/bitvue-formats.json,coverage/bitvue-cli.json
          flags: rust
          name: rust-coverage
          fail_ci_if_error: false

      - name: Upload coverage JSON (artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/

      - name: Coverage summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "Crates measured: bitvue-hevc, bitvue-avc, bitvue-vp9, bitvue-av1-codec, bitvue-avs3, bitvue-jpegxs, bitvue-vc3, bitvue-codecs-parser, bitvue-engine, bitvue-formats, bitvue-cli" >> $GITHUB_STEP_SUMMARY

  # ================================
  # 5. Frontend Full Checks (PR only)
  # ================================

  frontend-fmt:
    name: Format (Frontend)
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      needs.changes.outputs.frontend == 'true' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Check formatting
        run: cd frontend && npm run format:check

  frontend-lint:
    name: Lint (Frontend)
    needs: [changes, frontend-fmt]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.frontend-fmt.result == 'success' || needs.frontend-fmt.result == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Lint TypeScript
        run: cd frontend && npm run lint
      - name: Lint CSS
        run: cd frontend && npm run lint:css

  frontend-test:
    name: Test (Frontend)
    needs: [changes, frontend-fmt, frontend-lint]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.frontend-fmt.result == 'success' || needs.frontend-fmt.result == 'skipped') &&
      (needs.frontend-lint.result == 'success' || needs.frontend-lint.result == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run tests
        run: cd frontend && npm run test:run

  # ================================
  # 6. Documentation (always runs if Rust changes)
  # ================================

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          build-warnings: allow
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdav1d-dev \
            libvmaf-dev \
            libavutil-dev \
            libavcodec-dev \
            libavformat-dev \
            libavfilter-dev \
            libswscale-dev \
            libswresample-dev \
            libavdevice-dev \
            pkg-config
      - name: Build documentation
        # --all-features pulls in bitvue-metrics' `vmaf` feature, whose
        # libvmaf-sys build script needs the system libvmaf (libvmaf-dev above).
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -A dead_code -A unused_variables -A unused_functions -A unused_macros -A non_snake_case -A non_camel_case_types
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
