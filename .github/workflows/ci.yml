name: CI

# Pipeline shape (everything below `changes` runs in parallel -- there is no serial gate chain):
#
#   changes ─┬─ rust-lint   fmt + clippy + bench compile + `--locked`     (ubuntu, ~2 min)
#            ├─ rust-test   one `cargo test --workspace` job per OS       (ubuntu / macOS / Windows)
#            ├─ parity      scripts/parity_check.sh --local against the CLI
#            ├─ coverage    cargo-llvm-cov -> Codecov
#            ├─ docs        cargo doc
#            ├─ frontend    prettier, eslint, stylelint, tsc, vitest, vite build
#            └─ desktop     sidecar build, tsc, vitest, Electron selftest under xvfb
#   ci-ok    aggregate: the single check to require in branch protection (skipped jobs count as ok)
#
# A job is skipped when its inputs did not change (see the `changes` filters). Caches are saved
# only from `main`: PR runs restore main's cache but never write one, otherwise per-PR caches
# evict main's (the repo's Actions cache was over its 10 GB limit with 57 PR-scoped entries).

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a PR branch cancels the stale run; pushes to main always run
# to completion so every merged commit keeps a full CI result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# dorny/paths-filter reads the pull request's file list through the API, so
# it needs pull-requests: read on top of what the checkout needs.
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ================================
  # 1. Detect changes
  # ================================

  changes:
    name: Detect Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            # A workflow/action edit counts as a change for every filter: it is the one change
            # that can break a job without touching the code the job tests.
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              # fixtures and scripts that the tests and the parity job read
              - 'test_data/**'
              - 'scripts/parity_check.sh'
              - 'scripts/run_regression_suite.sh'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            # The frontend's vitest config aliases bitvue-desktop/electron/menuEvents.ts, so a
            # desktop change can break frontend tests too.
            frontend:
              - 'frontend/**'
              - 'bitvue-desktop/electron/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            # The desktop job is the end-to-end one (real sidecar, real renderer), so anything
            # in the app stack triggers it.
            desktop:
              - 'bitvue-desktop/**'
              - 'frontend/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'test_data/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  # ================================
  # 2. Rust
  # ================================

  rust-lint:
    name: Rust Lint (fmt, clippy)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt, clippy
          cache: false
          build-warnings: allow
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - uses: ./.github/actions/install-dav1d
      - name: Clippy (also verifies Cargo.lock is current)
        run: cargo clippy --workspace --lib --exclude abseil --locked -- -D warnings
      # Benches are never run in CI; compile them so they cannot silently rot again.
      - name: Compile benches
        run: cargo check --workspace --exclude abseil --benches --locked

  rust-test:
    name: Rust Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          build-warnings: allow
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/install-dav1d
      # One workspace-wide run per OS instead of one job per crate: shared dependencies compile
      # once, and 3 jobs queue instead of 57. Excluded: abseil (private vendored fork, see
      # CLAUDE.md). Doc tests are included. --no-fail-fast reports every failing crate.
      - name: Test workspace
        run: cargo test --workspace --exclude abseil --no-fail-fast

  parity-regression:
    name: Parity Regression Suite
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          build-warnings: allow
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: parity
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/install-dav1d
      - name: Build CLI (debug)
        run: cargo build -p bitvue-cli --bin bitvue
      - name: Run parity regression suite
        run: ./scripts/parity_check.sh --local

  # Coverage on every PR and every push to main (main seeds the Codecov baseline).
  coverage:
    name: Code Coverage
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: llvm-tools-preview
          cache: false
          build-warnings: allow

      # rust-cache resolves `<workspace> -> <target>` with the target *relative to the workspace*
      # (an absolute path is joined under it), so point it at CARGO_TARGET_DIR=/tmp/t (set below)
      # via a relative path from /home/runner/work/bitvue/bitvue.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> ../../../../../tmp/t"
          shared-key: "coverage"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-llvm-cov

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev pkg-config

      # Use a short CARGO_TARGET_DIR (/tmp/t; the runner cannot create /t) and a per-crate approach to stay under
      # the Linux ARG_MAX limit (131072 bytes).  Each crate is measured
      # independently; reports are merged into a single Codecov upload.
      - name: Generate coverage (codec crates)
        env:
          CARGO_TARGET_DIR: /tmp/t
        run: |
          mkdir -p coverage
          for CRATE in bitvue-hevc bitvue-avc bitvue-vp9 bitvue-av1-codec bitvue-avs3 bitvue-jpegxs bitvue-vc3 bitvue-codecs-parser bitvue-engine bitvue-formats bitvue-cli; do
            echo "=== $CRATE ==="
            cargo llvm-cov \
              --package "$CRATE" \
              --codecov \
              --output-path "coverage/${CRATE}.json"
          done

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage/bitvue-hevc.json,coverage/bitvue-avc.json,coverage/bitvue-vp9.json,coverage/bitvue-av1-codec.json,coverage/bitvue-avs3.json,coverage/bitvue-jpegxs.json,coverage/bitvue-vc3.json,coverage/bitvue-codecs-parser.json,coverage/bitvue-engine.json,coverage/bitvue-formats.json,coverage/bitvue-cli.json
          flags: rust
          name: rust-coverage
          fail_ci_if_error: false

      - name: Upload coverage JSON (artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/

      - name: Coverage summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "Crates measured: bitvue-hevc, bitvue-avc, bitvue-vp9, bitvue-av1-codec, bitvue-avs3, bitvue-jpegxs, bitvue-vc3, bitvue-codecs-parser, bitvue-engine, bitvue-formats, bitvue-cli" >> $GITHUB_STEP_SUMMARY

  # ================================
  # 3. Frontend
  # ================================
  # One job: the steps share a single `npm ci`, and a failing step stops the rest.

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Check formatting
        run: cd frontend && npm run format:check
      - name: Lint TypeScript
        run: cd frontend && npm run lint:check
      - name: Lint CSS
        run: cd frontend && npm run lint:css:check
      - name: Tests
        run: cd frontend && npm run test:run
      # `build` = `tsc && vite build`, i.e. also the type-check
      - name: Type-check and build
        run: cd frontend && npm run build

  # ================================
  # 4. Desktop (Electron main process + the whole stack end to end)
  # ================================

  desktop:
    name: Desktop (Electron)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          build-warnings: allow
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/install-dav1d
      - name: Build sidecar (debug; the integration tests and the selftest spawn target/debug/bitvue-sidecar)
        run: cargo build -p bitvue-sidecar
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            bitvue-desktop/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend && npm ci
          cd ../bitvue-desktop && npm ci
      - name: Type-check
        run: cd bitvue-desktop && npm run typecheck
      - name: Unit and integration tests
        run: cd bitvue-desktop && npm run test:run
      - name: Build renderer and Electron main
        run: |
          cd frontend && npm run build
          cd ../bitvue-desktop && npm run build:electron
      # The selftest drives the real renderer <-> preload <-> main <-> sidecar chain and also
      # fails on renderer console errors. --no-sandbox: the unpackaged Electron binary has no
      # setuid chrome-sandbox on a CI runner.
      - name: Electron selftest (xvfb)
        run: cd bitvue-desktop && BITVUE_ELECTRON_SELFTEST=1 xvfb-run -a npx electron --no-sandbox .
      - name: Electron screenshot (visual evidence)
        if: always()
        run: |
          cd bitvue-desktop
          BITVUE_ELECTRON_SCREENSHOT="$RUNNER_TEMP/bitvue-main.png" \
          BITVUE_ELECTRON_SELFTEST_FIXTURE_PATH="$GITHUB_WORKSPACE/test_data/av1_test.ivf" \
            xvfb-run -a npx electron --no-sandbox .
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-screenshot
          path: ${{ runner.temp }}/bitvue-main.png
          if-no-files-found: warn

  # ================================
  # 5. Documentation
  # ================================

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          build-warnings: allow
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdav1d-dev pkg-config
      - name: Build documentation
        # Not `--all-features`: the `ffmpeg`/`vmaf` features pull in ffmpeg-next 6 (pinned by
        # libvmaf-rs), which cannot build against FFmpeg >= 7. Revisit once libvmaf-rs moves on.
        run: >-
          cargo doc --no-deps --workspace --exclude abseil
          --features bitvue-av1-codec/debug-strings
        env:
          RUSTDOCFLAGS: -A dead_code -A unused_variables -A unused_functions -A unused_macros -A non_snake_case -A non_camel_case_types
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig

  # ================================
  # 6. Aggregate
  # ================================
  # Require this one check in branch protection: jobs skipped by the path filters count as
  # success, a failed or cancelled job does not.

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, rust-lint, rust-test, parity-regression, coverage, frontend, desktop, docs]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if [ '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}' = 'true' ]; then
            exit 1
          fi
