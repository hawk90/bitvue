name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.11.0)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Strip 'v' prefix for numeric version
          CLEAN_VERSION=${VERSION#v}
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

  # NOTE: the Tauri app build job was removed 2026-08-08 when src-tauri was retired (Electron
  # migration, see docs/DEVELOPMENT_PHASES.md). There is no Electron desktop-app build/packaging
  # workflow yet -- bitvue-desktop only has dev-mode scripts so far. Add one here once that exists.

  # Publish crates to crates.io
  publish-crates:
    needs: prepare
    uses: ./.github/workflows/publish-packages.yml
    with:
      version: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
