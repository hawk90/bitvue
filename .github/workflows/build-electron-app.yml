name: Build Electron App

# Builds the Electron desktop app (bitvue-desktop + bitvue-sidecar + frontend), replacing the
# Tauri app build removed 2026-08-08 (see docs/DEVELOPMENT_PHASES.md § "제품 아키텍처 확정").
# Packaging is unsigned for now -- no code-signing certs/secrets exist yet, see the "Known
# simplifications" note in that doc. Each matrix leg builds for its own runner's native
# architecture only (no cross-compilation/universal binaries).

# Tag pushes are NOT a trigger here: release.yml calls this workflow for the
# tag (with `tag:` set), and a second direct run used to build and publish the
# same release twice.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Packaging takes minutes on three OSes; skip it for PRs that cannot change the package
    # (docs, CI-only edits to other workflows). Tags and manual runs always build.
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'frontend/**'
      - 'bitvue-desktop/**'
      - 'resources/**'
      - 'samples/**'
      - '.github/workflows/build-electron-app.yml'
      - '.github/actions/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.1.0)'
        required: false
        type: string

concurrency:
  group: build-electron-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            electron_platform: mac
            artifact_glob: release/*.zip
          - os: windows-latest
            electron_platform: win
            artifact_glob: release/*.exe
          # Release binaries link against the build host's glibc; build on the oldest supported
          # runner so they still run on older distros (ci.yml checks use 26.04).
          - os: ubuntu-24.04
            electron_platform: linux
            artifact_glob: release/*.AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          build-warnings: allow

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: electron-${{ matrix.os }}
          # PR runs restore main's cache but do not write their own (see ci.yml)
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/install-dav1d

      - name: Build sidecar (release)
        run: cargo build --release -p bitvue-sidecar

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            bitvue-desktop/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install bitvue-desktop deps
        run: cd bitvue-desktop && npm ci

      - name: Package Electron app
        run: cd bitvue-desktop && npm run package:${{ matrix.electron_platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bitvue-${{ matrix.electron_platform }}
          path: bitvue-desktop/${{ matrix.artifact_glob }}
          if-no-files-found: warn

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: bitvue-*
          merge-multiple: true

      - name: Show downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Bitvue ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
