name: Fuzz

# Scheduled fuzzing of the AV1 parsing targets (#135). `ci.yml`'s `fuzz-build` job only proves the
# targets compile; this runs them. Every target gets `seconds` of fuzzing per run (default 120), seeded
# from test_data/ and from the corpus the previous run left in the Actions cache, so coverage builds up
# week over week. A crash, hang or out-of-memory fails the job and uploads the input.
#
# Decisions, all from the first long runs (see fuzz/README.md):
#   - `-s none`: cargo-fuzz's default AddressSanitizer inflates the process 5-10x (a 16 KB input
#     showed 356 MB instead of 25 MB), which made the 1 GB limit report bugs that were not there. The
#     sanitizer-free build is also several times faster, and still catches panics, index and overflow
#     errors (debug assertions stay on). Memory errors in `unsafe` code are what it gives up.
#   - `av1_decode` fuzzes our wrapper around dav1d (installed by the action below), not dav1d itself,
#     which upstream covers. It found three wrapper defects (#341), so it runs here with the rest.
#   - The corpus cache is saved only by a job that succeeded, and is minimized first (`cmin`), so it
#     cannot grow without bound. The repo's Actions cache is limited to 10 GB.

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time per target, in seconds
        default: '120'

concurrency:
  group: fuzz
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with fuzz/fuzz_targets/ (scripts/check_fuzz_targets.sh checks it).
        target:
          - stream_analysis
          - frame_analysis
          - syntax_parser
          - obu_stream
          - obu_parser
          - ivf_parser
          - leb128
          - protocol_frames
          - av1_decode
          - tile_group_split
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly
          cache: false
          build-warnings: allow
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
          shared-key: fuzz-nightly
      - uses: ./.github/actions/install-dav1d
      # Built with stable: --locked pins rustix 0.36, which does not compile on a current nightly
      # (it sets a `rustc_*` attribute that nightly now rejects). The fuzz targets still use nightly.
      - name: Install cargo-fuzz
        run: |
          command -v cargo-fuzz && exit 0
          rustup toolchain install stable --profile minimal --no-self-update
          cargo +stable install cargo-fuzz --locked --version 0.13.1

      - name: Restore the corpus of the last run
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed from test_data/
        run: python3 scripts/fuzz_seed_corpus.py

      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: >-
          cargo fuzz run -s none ${{ matrix.target }} --
          -max_total_time=${{ inputs.seconds || 120 }}
          -rss_limit_mb=2048 -timeout=20 -max_len=200000
      - name: Minimize the corpus
        working-directory: fuzz
        run: cargo fuzz cmin -s none ${{ matrix.target }}

      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
