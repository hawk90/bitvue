[package]
name = "bitvue-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bitvue-av1-codec = { path = "../crates/bitvue-av1-codec" }
bitvue-engine = { path = "../crates/bitvue-engine" }
bitvue-decode = { path = "../crates/bitvue-decode" }

# Keep out of the parent workspace
[workspace]

[[bin]]
name = "obu_parser"
path = "fuzz_targets/obu_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ivf_parser"
path = "fuzz_targets/ivf_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "leb128"
path = "fuzz_targets/leb128.rs"
test = false
doc = false
bench = false

[[bin]]
name = "obu_stream"
path = "fuzz_targets/obu_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_analysis"
path = "fuzz_targets/frame_analysis.rs"
test = false
doc = false
bench = false

[[bin]]
name = "syntax_parser"
path = "fuzz_targets/syntax_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "av1_decode"
path = "fuzz_targets/av1_decode.rs"
test = false
doc = false
bench = false
