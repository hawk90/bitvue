[package]
name = "bitvue-decode"
description = "Multi-codec decoder wrapper (AV1, H.264, HEVC, VVC) for bitvue"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bitvue-engine = { workspace = true }
bitvue-av1-codec = { workspace = true }
abseil = { workspace = true }
dav1d = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ffmpeg-next = { version = "9", optional = true }
rayon = "1.12.0"

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
ffmpeg = ["ffmpeg-next"]
# H.266/VVC via the system libvvdec 3.x (found with pkg-config, see build.rs)
vvdec = ["dep:pkg-config"]

[build-dependencies]
pkg-config = { version = "0.3", optional = true }
