[package]
name = "bitvue-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bitvue-mcp-server"
path = "src/main.rs"

[dependencies]
bitvue-engine = { path = "../bitvue-engine" }
bitvue-av1-codec = { path = "../bitvue-av1-codec" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
async-trait = "0.1.92"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
